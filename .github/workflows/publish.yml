name: Publish package to npmjs
on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.2.0
        with:
          runtime: node@26.13.1
      - run: pnpm stage publish --access public --provenance --no-git-checks
